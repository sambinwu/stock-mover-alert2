name: stock-mover-alert

on:
  schedule:
    # GitHub schedules each cron ENTRY independently and silently drops slots
    # when the hosted scheduler is under load. A single tight '*/5' line was
    # observed producing only 1-3 runs per day (2026-08-28: one run all day),
    # which is how a real move can go unreported for a whole session.
    #
    # So: two offset intraday entries instead of one tight one, plus a dense
    # after-close net. Cron is UTC. Regular hours, EDT/EST union, are
    # 13:30-21:00 UTC (EDT 09:30-16:00 == 13:30-20:00; EST == 14:30-21:00).
    - cron: '*/15 13-21 * * 1-5'
    - cron: '7-59/15 13-21 * * 1-5'
    # After the close the session's numbers are final, so these are the runs
    # that matter most -- 16:00-19:45 ET and 20:00-21:45 ET.
    - cron: '*/15 20-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stock-mover-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute trading day key
        id: day
        run: echo "key=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore alert state
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ steps.day.outputs.key }}-final
          restore-keys: |
            alert-state-${{ steps.day.outputs.key }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python alert.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: alert-state-${{ steps.day.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
