name: stock-mover-alert

on:
  schedule:
    # US regular trading hours, Mon-Fri.
    # Cron is in UTC. We cover both EDT (UTC-4) and EST (UTC-5):
    #   EDT regular hours 09:30-16:00 ET == 13:30-20:00 UTC
    #   EST regular hours 09:30-16:00 ET == 14:30-21:00 UTC
    # Union: 13:30-21:00 UTC. The Python script (alert.py) further
    # gates execution with an NYSE calendar check, so US market
    # holidays and early-close half-days are also respected.
    - cron: '*/15 13-20 * * 1-5'
    - cron: '0,15,30,45 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stock-mover-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute trading day key
        id: day
        run: echo "key=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore alert state
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ steps.day.outputs.key }}-final
          restore-keys: |
            alert-state-${{ steps.day.outputs.key }}-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python alert.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: alert-state-${{ steps.day.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
