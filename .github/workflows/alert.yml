name: stock-mover-alert

on:
  schedule:
    # GitHub silently drops most cron slots (2026-10-07: ~70 scheduled, 6 ran,
    # the first at 15:13 ET). So one run now WATCHES the whole session
    # (alert.py loops every 3 min until 20 min after the close), and these
    # entries only need ONE of them to fire for the day to be covered. Extra
    # runs see the watcher in the lock step and exit in seconds.
    # Cron is UTC; 13:03-20:53 UTC covers the open in both EDT and EST.
    - cron: '3-59/10 13-20 * * 1-5'
    # After-close safety net (also covers EST closes at 21:00 UTC).
    - cron: '17,47 21-23 * * 1-5'
    - cron: '17,47 0-1 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # lock check + keep the schedule enabled

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Lock (exit if an older run is already watching)
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          older=$(gh api "repos/${{ github.repository }}/actions/workflows/alert.yml/runs?status=in_progress&per_page=50" \
            --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length' || echo 0)
          older=${older:-0}
          echo "older in-progress runs: $older"
          if [ "$older" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the schedule enabled
        if: steps.lock.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/alert.yml/enable" || true

      - name: Checkout
        if: steps.lock.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Restore alert state
        if: steps.lock.outputs.skip == 'false'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Set up Python
        if: steps.lock.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.lock.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Watch the session
        if: steps.lock.outputs.skip == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python alert.py

      - name: Save alert state
        if: always() && steps.lock.outputs.skip == 'false'
        uses: actions/cache/save@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Tell Slack if this run broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only the first failure of the day pings Slack (no spam if it keeps failing).
          today=$(TZ=America/New_York date +%Y-%m-%d)
          since=$(date -d "TZ=\"America/New_York\" $today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          prior=$(gh api "repos/${{ github.repository }}/actions/workflows/alert.yml/runs?status=failure&created=%3E%3D$since&per_page=50" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length' || echo 0)
          if [ "${prior:-0}" -gt 0 ]; then echo "already reported today"; exit 0; fi
          python3 -c 'import json,os; print(json.dumps({"text": "⚠️ stock-mover-alert 运行失败，异动提醒可能中断：" + os.environ["RUN_URL"]}))' > payload.json
          curl -sS -X POST -H 'Content-Type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL" || true
